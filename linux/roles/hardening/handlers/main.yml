---
- name: Appliquer les paramètres du noyau
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: not lc_conteneur

- name: Recharger les règles d'audit
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: not lc_conteneur

- name: Redémarrer USBGuard
  ansible.builtin.systemd_service:
    name: usbguard
    state: restarted
  when: not lc_conteneur
