<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA non autorisée</title>
<style>
  :root { --texte: #1f3a40; --doux: #4f6b70; --accent: #2190a4; --fond: #eef6f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, "Inter", "Ubuntu Sans", sans-serif;
    color: var(--texte);
    background: var(--fond);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  main {
    max-width: 560px;
    width: 100%;
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(33, 144, 164, .15);
  }
  h1 { font-size: 26px; margin: 0 0 12px; }
  p { font-size: 17px; line-height: 1.6; color: var(--doux); margin: 0 0 12px; }
  .site { font-weight: 600; color: var(--texte); }
  button {
    margin-top: 12px;
    font: inherit;
    font-size: 16px;
    border: 0;
    border-radius: 999px;
    padding: 12px 26px;
    background: var(--accent);
    color: #ffffff;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--texte); outline-offset: 3px; }
  kbd { border: 1px solid #c5d6d9; border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; font-size: 14px; }
  [hidden] { display: none; }
</style>
</head>
<body>
  <main>
    <h1>Cette IA n'est pas autorisée</h1>
    <p><span class="site" id="site">Ce site</span> n'est pas accessible depuis les postes de l'étude :
       les dossiers sont couverts par le secret professionnel.</p>
    <p>Utilisez l'IA métier de l'étude : touche <kbd>Super</kbd> + <kbd>Espace</kbd>, ou son icône dans le dock.</p>
    <button type="button" id="ouvrir" hidden>Ouvrir l'IA métier</button>
  </main>
  <script src="ia.js"></script>
</body>
</html>
