---
- name: Retirer les jeux et logiciels inutiles
  ansible.builtin.apt:
    name: "{{ paquets_a_retirer }}"
    state: absent
    purge: true
    lock_timeout: 600

- name: Détecter snap
  ansible.builtin.stat:
    path: /usr/bin/snap
  register: lc_snap

- name: Retirer toutes les applications snap
  ansible.builtin.shell: |
    set -o pipefail
    for passe in 1 2 3; do
      reste=$(snap list 2>/dev/null | awk 'NR > 1 && $1 != "snapd" {print $1}')
      [ -z "$reste" ] && break
      for s in $reste; do snap remove --purge "$s" >/dev/null 2>&1 || true; done
    done
    [ "$(snap list 2>/dev/null | awk 'NR > 1 && $1 != "snapd"' | wc -l)" -eq 0 ]
  args:
    executable: /bin/bash
  changed_when: true
  when: retirer_snapd and lc_snap.stat.exists and not lc_conteneur

- name: Retirer snapd
  ansible.builtin.apt:
    name: snapd
    state: absent
    purge: true
    lock_timeout: 600
  when: retirer_snapd

- name: Empêcher la réinstallation de snapd
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/linux-collab-sans-snap
    content: |
      # Géré par linux-collab : aucune application snap sur les postes (cf. docs/NOTES.md §19).
      Package: snapd
      Pin: release a=*
      Pin-Priority: -10
    mode: "0644"
  when: retirer_snapd

- name: Supprimer les dossiers résiduels de snap
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /snap
    - /var/snap
    - /var/lib/snapd
    - /var/cache/snapd
  when: retirer_snapd

- name: Retirer les dépendances devenues inutiles
  ansible.builtin.apt:
    autoremove: true
    purge: true
    lock_timeout: 600
