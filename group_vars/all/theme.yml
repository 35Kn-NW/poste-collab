---
# Style visuel unique (cf. docs/NOTES.md §15).
# Pour changer de style : modifier ce fichier puis relancer le déploiement.
theme:
  style: default                  # clair
  accent: teal                    # bleu-vert
  icones: Papirus-Light
  curseur: Bibata-Modern-Classic
  police_interface: Inter 11
  police_documents: Inter 11
  police_terminal: JetBrains Mono 11

# Fond d'écran de l'étude : chemin du fichier sur le poste, à renseigner dans
# /etc/linux-collab/local.yml. Vide : fond provisoire du dépôt.
fond_ecran_fichier: ""

# Logo de l'écran de connexion : chemin du fichier sur le poste. Vide : aucun logo.
logo_ecran_connexion: ""

# Verrouillage automatique de la session (secondes).
verrouillage_apres_secondes: 300

# Applications épinglées dans le dock (identifiants .desktop) ; complétées par les lots suivants.
dock_applications:
  - app.zen_browser.zen.desktop
  - org.gnome.Nautilus.desktop
  - qalculate-gtk.desktop
